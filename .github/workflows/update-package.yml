name: Update Dependency Version

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-package:
    name: Check for groupdocs-total updates
    runs-on: ubuntu-latest
    env:
      PKG_LIST: "com.groupdocs:groupdocs-total"
      REPO_URL: "https://releases.groupdocs.com/java/repo"
      POM: Examples/pom.xml
    steps:
      - uses: actions/checkout@v4

      - name: Check for updates and bump versions
        id: versions
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os, re, urllib.request

          pom_path = os.environ["POM"]
          repo = os.environ["REPO_URL"]
          packages = os.environ["PKG_LIST"].split()

          with open(pom_path, "r", encoding="utf-8", newline="") as f:
              pom = f.read()

          needs = False
          notes = []

          for entry in packages:
              gid, aid = entry.split(":", 1)
              meta_url = "{}/{}/{}/maven-metadata.xml".format(
                  repo, gid.replace(".", "/"), aid)
              try:
                  with urllib.request.urlopen(meta_url) as resp:
                      meta = resp.read().decode("utf-8")
              except Exception as e:
                  raise SystemExit("Could not fetch metadata for {}: {}".format(aid, e))

              m = re.search(r"<release>([^<]+)</release>", meta) or re.search(
                  r"<latest>([^<]+)</latest>", meta)
              if not m:
                  raise SystemExit("Could not determine latest version for " + aid)
              latest = m.group(1)

              # Only the <version> that immediately follows this exact artifactId.
              pat = re.compile(
                  r"(<artifactId>" + re.escape(aid) + r"</artifactId>\s*<version>)([^<]+)(</version>)"
              )
              match = pat.search(pom)
              if not match:
                  raise SystemExit("Could not find {} version in {}".format(aid, pom_path))
              current = match.group(2)
              print("{}: {} -> {}".format(aid, current, latest))
              if current != latest:
                  pom, n = pat.subn(r"\g<1>" + latest + r"\g<3>", pom, count=1)
                  if n != 1:
                      raise SystemExit("Failed to replace version for " + aid)
                  needs = True
                  notes.append("{} {}".format(aid, latest))

          with open(pom_path, "w", encoding="utf-8", newline="") as f:
              f.write(pom)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("needs_update={}\n".format("true" if needs else "false"))
              out.write("notes={}\n".format(", ".join(notes)))
          PY

      - name: Commit and push
        if: steps.versions.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$POM"
          git commit -m "Update ${{ steps.versions.outputs.notes }}"
          git push
